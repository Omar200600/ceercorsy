<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3D Axis - Chair Model</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <!-- ضع رابط ملف الـ OBJ وملف الـ MTL هنا -->
        <a-asset-item id="chair-obj" src="chair_f.obj"></a-asset-item>
        <a-asset-item id="chair-mtl" src="chair_f.mtl"></a-asset-item>
      </a-assets>

      <!-- الإضاءة لضمان ظهور ألوان الكرسي وعدم اسوداده -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" position="-1 2 1" intensity="0.5"></a-light>

      <!-- استدعاء الكرسي مع تصغير الحجم (Scale) وضبط الموقع -->
      <a-entity 
        obj-model="obj: #chair-obj; mtl: #chair-mtl" 
        position="0 0 -3" 
        scale="0.02 0.02 0.02" 
        rotation="0 45 0">
      </a-entity>

      <!-- الكاميرا -->
      <a-entity id="rig" position="0 1.6 0">
        <a-camera look-controls wasd-controls></a-camera>
      </a-entity>

      <!-- الأرضية -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECF6"></a-sky>
    </a-scene>
  </body>
</html>
