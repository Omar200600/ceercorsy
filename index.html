<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Chair Array Scene</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('chair-array', {
        schema: {
          rows: {type: 'int', default: 3},
          cols: {type: 'int', default: 4},
          spacingX: {type: 'number', default: 1.5},
          spacingZ: {type: 'number', default: 1.5}
        },
        init: function () {
          const data = this.data;
          for (let r = 0; r < data.rows; r++) {
            for (let c = 0; c < data.cols; c++) {
              let chair = document.createElement('a-entity');
              chair.setAttribute('gltf-model', '#office-chair');
              chair.setAttribute('position', {
                x: (c - (data.cols - 1) / 2) * data.spacingX,
                y: 0,
                z: r * data.spacingZ
              });
              this.el.appendChild(chair);
            }
          }
        }
      });
    </script>
  </head>
  <body>
    <a-scene loading-screen="enabled: false">
      <a-assets>
        <!-- ضع مسار ملف الكرسي الخاص بك سواء رابط Vercel أو اسم الملف المحلي -->
        <a-asset-item id="office-chair" src="office_chair.gltf"></a-asset-item>
      </a-assets>

      <!-- الإضاءة -->
      <a-entity type="ambient" light="color: #FFF; intensity: 0.8"></a-entity>
      <a-entity type="directional" light="intensity: 0.5" position="-1 4 2"></a-entity>

      <!-- أرضية خفيفة جداً -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane>

      <!-- مصفوفة الكراسي -->
      <a-entity chair-array="rows: 4; cols: 5; spacingX: 1.2; spacingZ: 1.3" position="0 0 -3"></a-entity>

      <!-- الكاميرا -->
      <a-entity position="0 1.6 3">
        <a-camera></a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
